<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>𝔢𝔵𝔬𝔱𝔦𝔠</title>
<link rel="icon" type="image/jpg" href="assets/icony.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#000000;
    --panel:rgba(0,0,0,0.3);
    --paper:#ffffff;
    --mist:rgba(255,255,255,0.62);
    --ash:rgba(255,255,255,0.30);
    --hair:rgba(255,255,255,0.10);
    --font-ui:'JetBrains Mono', 'Courier New', monospace;
    --font-display:'Angel Wish', serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;user-drag:none;}
  *{cursor:none !important;}

  @font-face{
    font-family:'Angel Wish';
    src:url('assets/Angel_wish.ttf') format('truetype');
    font-weight:normal; font-style:normal; font-display:swap;
  }

  html,body{height:100%;}
  body{
    background:var(--void);
    color:var(--paper);
    overflow:hidden;
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- background video ---------- */
  #background{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    min-width:100%; min-height:100%; width:auto; height:auto; object-fit:cover;
    z-index:1; pointer-events:none; opacity:0;
    transition:opacity 1.4s ease;
  }
  #background.visible{opacity:0.7;}

  /* ---------- HUD ---------- */
  .hud{
    position:fixed; z-index:15; font-family:var(--font-ui); font-size:10.5px;
    letter-spacing:1.5px; color:var(--ash); pointer-events:none;
    opacity:0; transition:opacity 1s ease;
  }
  .hud.visible{opacity:1;}
  .hud-tl{top:22px; left:26px;}
  .hud-bl{bottom:22px; left:26px;}
  .hud b{color:var(--mist); font-weight:500;}
  @media (max-width:700px){ .hud{display:none;} }

  /* ---------- start screen ---------- */
  #start-screen{
    position:fixed; inset:0; background:#000; display:flex;
    align-items:center; justify-content:center; z-index:50;
    transition:opacity 0.8s ease, backdrop-filter 0.8s ease;
  }
  #start-screen.hidden{
    opacity:0;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    pointer-events:none;
  }
  #start-text{
    font-family:var(--font-ui); font-size:26px; letter-spacing:2px; color:#fff;
    position:relative; z-index:2;
  }

  /* ---------- profile card frame ---------- */
  .stage{
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
  }
  .frame{
    position:relative; width:520px; max-width:92vw; opacity:0;
  }

  #profile-block{
    position:relative; width:100%;
    background:var(--panel); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--hair); border-radius:12px;
    padding:34px 34px 24px; display:flex; flex-direction:column; gap:4px;
    transform-style:preserve-3d; will-change:transform; perspective:700px;
    box-shadow:0 0 0 1px rgba(255,255,255,.02), 0 30px 80px rgba(0,0,0,.7);
  }

  .username-section{ text-align:center; min-height:58px; position:relative; }
  #profile-username{
    font-family:var(--font-display); font-size:42px; font-weight:400; letter-spacing:3px;
    color:#fff; filter:drop-shadow(0 0 18px rgba(255,255,255,.35)); display:inline-block; min-height:56px;
  }

  .rule{
    width:56px; height:1px; margin:16px auto; background:linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
  }

  .badge-section{
    display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom:16px; padding:2px 0;
  }
  .badge-container{ position:relative; width:32px; height:32px; }
  .badge{
    width:32px; height:32px; display:block; border-radius:4px; object-fit:contain;
    filter:grayscale(.55) brightness(1.05); opacity:.85;
    transition:transform .3s cubic-bezier(.25,.1,.25,1), filter .3s ease, opacity .3s ease;
  }
  .badge:hover{ transform:translateY(-3px) scale(1.12); filter:grayscale(0) brightness(1.15) drop-shadow(0 0 10px rgba(255,255,255,.5)); opacity:1; }

  .tooltip{
    visibility:hidden; opacity:0; background:rgba(0,0,0,.6); backdrop-filter:blur(14px);
    color:#fff; text-align:center; border-radius:4px; padding:5px 10px; position:absolute;
    z-index:9999; bottom:calc(100% + 10px); left:50%;
    transform:translateX(-50%) translateY(4px); transition:.22s cubic-bezier(.25,.1,.25,1);
    font-size:10px; letter-spacing:1px; white-space:nowrap; border:1px solid var(--hair);
    pointer-events:none; text-transform:uppercase;
  }
  .badge-container:hover .tooltip{ visibility:visible; opacity:1; transform:translateX(-50%) translateY(0); }

  #profile-bio{
    color:var(--mist); font-size:15.5px; line-height:1.6; min-height:2.1em; text-align:center;
    margin:2px 0 18px; padding:0 6px; letter-spacing:.2px;
  }
  #profile-bio .bio-link{
    color:#4fc3f7;
    text-decoration:none;
    background:linear-gradient(90deg, #4fc3f7, #ffffff, #4fc3f7);
    background-size:200% 100%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shimmer-text 3s ease-in-out infinite;
    font-weight:bold;
    cursor:pointer;
    transition:filter .3s ease;
  }
  #profile-bio .bio-link:hover{
    filter:drop-shadow(0 0 12px rgba(79,195,247,0.6));
  }
  @keyframes shimmer-text{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  .glitch{ animation:glitch .18s ease-in-out; }
  @keyframes glitch{
    0%{transform:translate(0);} 25%{transform:translate(-1px,1px);}
    50%{transform:translate(1px,-1px);} 75%{transform:translate(-1px,-1px);}
    100%{transform:translate(0);}
  }

  .profile-main{
    display:flex; align-items:center; gap:16px; background:rgba(255,255,255,.03);
    border:1px solid var(--hair); border-radius:8px; padding:13px 18px; max-width:420px;
    margin:4px auto 14px; width:100%; transition:border-color .4s ease, box-shadow .4s ease;
  }
  .profile-main:hover{
    border-color:rgba(255,255,255,.35);
    box-shadow:0 0 30px rgba(255,255,255,.08);
  }

  .profile-container{ position:relative; width:56px; height:56px; flex-shrink:0; }
  .profile-picture{
    width:56px; height:56px; border-radius:50%; object-fit:cover; display:block;
    border:1px solid rgba(255,255,255,.18); filter:grayscale(.2);
  }
  .status-ring{
    position:absolute; bottom:-1px; right:-1px; width:15px; height:15px; border-radius:50%;
    border:2px solid #000; background:#3a3a3a; transition:all .3s ease;
  }
  .status-ring.online{ background:#fff; box-shadow:0 0 10px rgba(255,255,255,.9); }
  .status-ring.idle{ background:#cfcfcf; box-shadow:0 0 8px rgba(255,255,255,.5); }
  .status-ring.dnd{ background:#8a8a8a; box-shadow:0 0 6px rgba(255,255,255,.3); }
  .status-ring.offline{ background:#3a3a3a; box-shadow:none; }

  .profile-name-section{ flex:1; display:flex; flex-direction:column; min-width:120px; }
  .profile-display-name{
    font-family:var(--font-display); font-size:18px; color:#fff; letter-spacing:.5px; text-align:left;
  }
  .last-seen{ font-size:10px; color:var(--ash); margin-top:4px; text-align:left; letter-spacing:.5px; }

  /* SOCIAL LINK */
  .social-links{
    display:flex; justify-content:center; gap:26px; align-items:center; padding:2px 0 0;
  }
  .social-link-tooltip{ position:relative; display:inline-block; }
  .social-icon{
    width:32px; height:32px; opacity:.7; filter:grayscale(1) brightness(2) drop-shadow(0 0 0 rgba(255,255,255,0));
    transition:transform .3s ease, filter .3s ease, opacity .3s ease;
  }
  .social-link-tooltip:hover .social-icon{
    opacity:1; transform:translateY(-3px); filter:grayscale(1) brightness(2) drop-shadow(0 0 14px rgba(255,255,255,.7));
  }
  .social-link-tooltip .tooltip-text{
    visibility:hidden; opacity:0; background:rgba(0,0,0,.6); backdrop-filter:blur(14px);
    color:#fff; text-align:center; border-radius:4px; padding:5px 10px; position:absolute;
    z-index:9999; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%) translateY(4px);
    transition:.22s cubic-bezier(.25,.1,.25,1); font-size:10px; letter-spacing:1px; white-space:nowrap;
    border:1px solid var(--hair); pointer-events:none; text-transform:uppercase;
  }
  .social-link-tooltip:hover .tooltip-text{ visibility:visible; opacity:1; transform:translateX(-50%) translateY(0); }

  .hidden{ display:none !important; }

  @media (max-width:580px){
    #profile-block{ padding:26px 20px 18px; border-radius:10px; }
    #profile-username{ font-size:32px; min-height:44px; }
    .profile-main{ max-width:340px; padding:10px 14px; gap:12px; border-radius:6px; }
    .profile-container,.profile-picture{ width:48px; height:48px; }
    .profile-display-name{ font-size:15px; }
    .badge,.badge-container{ width:27px; height:27px; }
    .social-icon{ width:28px; height:28px; }
  }
</style>
</head>
<body>

<div class="custom-cursor" id="customCursor"></div>

<!-- HUD: solo clock e uptime -->
<div class="hud hud-tl" id="hudTl"><b>CLOCK</b> <span id="clock">00:00:00</span></div>
<div class="hud hud-bl" id="hudBl"><b>UPTIME</b> <span id="uptime">00:00</span></div>

<div id="start-screen">
  <div id="start-text"></div>
</div>

<video id="background" autoplay loop muted playsinline webkit-playsinline disablePictureInPicture controlslist="nodownload nofullscreen noremoteplayback">
  <source src="https://r2.guns.lol/a128e056-52ce-4903-a862-8a4761ebedc4.mp4" type="video/mp4">
</video>

<div class="stage">
  <div class="frame" id="frame">

    <div id="profile-block">
      <div class="username-section">
        <div id="profile-username"></div>
      </div>

      <div class="rule"></div>

      <div class="badge-section">
        <div class="badge-container"><img src="assets/owner.gif" alt="Owner" class="badge"><span class="tooltip">Owner</span></div>
        <div class="badge-container"><img src="assets/developer.png" alt="Developer" class="badge"><span class="tooltip">Developer</span></div>
        <div class="badge-container"><img src="assets/verified.gif" alt="Verified" class="badge"><span class="tooltip">Verified</span></div>
        <div class="badge-container"><img src="assets/nothing.gif" alt="Nothing" class="badge"><span class="tooltip">Nothing</span></div>
        <div class="badge-container"><img src="assets/meow.gif" alt="Meow" class="badge"><span class="tooltip">Meow</span></div>
        <div class="badge-container"><img src="assets/knife.webp" alt="Knife" class="badge"><span class="tooltip">Knife</span></div>
        <div class="badge-container"><img src="assets/what.gif" alt="What" class="badge"><span class="tooltip">What</span></div>
        <div class="badge-container"><img src="assets/dragon.gif" alt="Dragon" class="badge"><span class="tooltip">Dragon</span></div>
      </div>

      <div id="profile-bio"></div>

      <div class="profile-main">
        <div class="profile-container">
          <img src="assets/profile.gif" alt="Profile" class="profile-picture">
          <div class="status-ring online" id="status-ring"></div>
        </div>
        <div class="profile-name-section">
          <span class="profile-display-name">not.exotic.ton</span>
          <span class="last-seen" id="last-seen">Last seen: —</span>
        </div>
      </div>

      <div class="social-links">
        <a href="https://open.spotify.com/user/lopp05qs775yh0frde45qcf9c?si=84c4e551e4c24951" target="_blank" class="social-link-tooltip">
          <img src="assets/spotify.png" alt="Spotify" class="social-icon"><span class="tooltip-text">Spotify</span>
        </a>
        <a href="https://t.me/javph" target="_blank" class="social-link-tooltip">
          <img src="assets/telegram.png" alt="Telegram" class="social-icon"><span class="tooltip-text">Telegram</span>
        </a>
        <a href="https://discord.com/users/1019329014369882123" target="_blank" class="social-link-tooltip">
          <img src="assets/discord.png" alt="Discord" class="social-icon"><span class="tooltip-text">Discord</span>
        </a>
      </div>
    </div>
  </div>
</div>

<audio id="background-music" loop>
  <source src="https://r2.guns.lol/6556d09a-6fa7-420b-93c5-8ecd37424977.mp3" type="audio/mp3">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function(){
  "use strict";
  document.addEventListener('DOMContentLoaded', function(){

    const startScreen   = document.getElementById('start-screen');
    const startText     = document.getElementById('start-text');
    const frame         = document.getElementById('frame');
    const profileBlock  = document.getElementById('profile-block');
    const profileUsername = document.getElementById('profile-username');
    const profileBio    = document.getElementById('profile-bio');
    const backgroundVideo = document.getElementById('background');
    const backgroundMusic = document.getElementById('background-music');
    const customCursor  = document.getElementById('customCursor');
    const statusRing    = document.getElementById('status-ring');
    const lastSeen      = document.getElementById('last-seen');
    const clockEl       = document.getElementById('clock');
    const uptimeEl      = document.getElementById('uptime');
    const huds          = [document.getElementById('hudTl'), document.getElementById('hudBl')];

    let isTiltEnabled = false;
    const bootTime = Date.now();

    // CURSOR
    document.addEventListener('mousemove', (e) => {
      customCursor.style.left = e.clientX + 'px';
      customCursor.style.top = e.clientY + 'px';
    });

    // CLOCK / UPTIME
    function pad(n){ return n.toString().padStart(2,'0'); }
    function tickClock(){
      const d = new Date();
      clockEl.textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
      const diff = Math.floor((Date.now()-bootTime)/1000);
      const m = Math.floor(diff/60), s = diff%60;
      uptimeEl.textContent = pad(m)+':'+pad(s);
    }
    setInterval(tickClock, 1000);
    tickClock();

    // START SCREEN - "click" con typing e deleting
    const startMessage = "click here...";
    let startTextContent = '';
    let startIndex = 0;
    let isDeletingStart = false;
    let startCursorVisible = true;

    function typeWriterStart() {
      if (!isDeletingStart && startIndex < startMessage.length) {
        startTextContent = startMessage.slice(0, startIndex + 1);
        startIndex++;
        setTimeout(typeWriterStart, 100);
      } else if (isDeletingStart && startIndex > 0) {
        startTextContent = startMessage.slice(0, startIndex - 1);
        startIndex--;
        setTimeout(typeWriterStart, 60);
      } else if (startIndex === startMessage.length) {
        isDeletingStart = true;
        setTimeout(typeWriterStart, 1500);
      } else if (startIndex === 0 && isDeletingStart) {
        isDeletingStart = false;
        setTimeout(typeWriterStart, 500);
      }
      startText.textContent = startTextContent + (startCursorVisible ? '|' : ' ');
    }

    setInterval(() => {
      startCursorVisible = !startCursorVisible;
      startText.textContent = startTextContent + (startCursorVisible ? '|' : ' ');
    }, 500);

    typeWriterStart();

    // START APP
    function startApp() {
      startScreen.classList.add('hidden');

      if (backgroundVideo) {
        backgroundVideo.muted = true;
        backgroundVideo.play().catch(()=>{});
        setTimeout(()=> backgroundVideo.classList.add('visible'), 100);
      }
      if (backgroundMusic) {
        backgroundMusic.volume = 0.28;
        backgroundMusic.muted = false;
        backgroundMusic.play().catch(()=>{});
      }

      frame.style.display = 'block';
      gsap.fromTo(frame, {opacity:0, y:-24}, {opacity:1, y:0, duration:1, ease:'power2.out'});
      huds.forEach((h,i)=> setTimeout(()=> h.classList.add('visible'), 300 + i*120));

      typeWriterUsername();
      typeWriterBio();
      fetchDiscordStatus();
    }

    startScreen.addEventListener('click', startApp);
    startScreen.addEventListener('touchstart', (e)=>{ e.preventDefault(); startApp(); });

    // 3D TILT
    function handleTilt(e){
      if(!profileBlock) return;
      const rect = frame.getBoundingClientRect();
      const centerX = rect.left + rect.width/2;
      const centerY = rect.top + rect.height/2;
      let clientX, clientY;
      if(e.type === 'touchmove' || e.type === 'touchstart'){
        clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
      } else { clientX = e.clientX; clientY = e.clientY; }
      const relX = Math.max(-1, Math.min(1, (clientX-centerX)/(rect.width/2)));
      const relY = Math.max(-1, Math.min(1, (clientY-centerY)/(rect.height/2)));
      const maxTilt = 18;
      const tiltY = relX * maxTilt;
      const tiltX = -relY * maxTilt;
      profileBlock.style.transition = 'transform .08s cubic-bezier(.2,.1,.2,1)';
      profileBlock.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
    }
    function resetTilt(){
      if(!profileBlock) return;
      profileBlock.style.transition = 'transform .6s cubic-bezier(.25,.1,.25,1)';
      profileBlock.style.transform = 'rotateX(0deg) rotateY(0deg)';
    }
    if(frame){
      frame.addEventListener('mouseenter', () => { isTiltEnabled = true; });
      frame.addEventListener('mouseleave', () => { isTiltEnabled = false; resetTilt(); });
      frame.addEventListener('mousemove', (e) => { if(isTiltEnabled) handleTilt(e); });
      frame.addEventListener('touchstart', (e) => { isTiltEnabled = true; handleTilt(e); });
      frame.addEventListener('touchmove', (e) => { e.preventDefault(); if(isTiltEnabled) handleTilt(e); });
      frame.addEventListener('touchend', () => { isTiltEnabled = false; resetTilt(); });
    }

    // USERNAME TYPING
    const usernameTexts = ["𝔢𝔵𝔬𝔱𝔦𝔠"];
    let usernameIndex = 0, charIndex = 0, isDeleting = false, usernameCursorVisible = true;
    function typeWriterUsername(){
      const currentText = usernameTexts[usernameIndex];
      if(!isDeleting && charIndex <= currentText.length){
        profileUsername.textContent = currentText.substring(0,charIndex) + (usernameCursorVisible?'|':' ');
        charIndex++;
        setTimeout(typeWriterUsername, isDeleting?80:150);
      } else if(isDeleting && charIndex >= 0){
        profileUsername.textContent = currentText.substring(0,charIndex) + (usernameCursorVisible?'|':' ');
        charIndex--;
        setTimeout(typeWriterUsername, 60);
      } else if(!isDeleting && charIndex > currentText.length){
        isDeleting = true; setTimeout(typeWriterUsername, 2200);
      } else if(isDeleting && charIndex < 0){
        isDeleting = false; usernameIndex = (usernameIndex+1)%usernameTexts.length;
        setTimeout(typeWriterUsername, 500);
      }
    }
    setInterval(()=>{
      usernameCursorVisible = !usernameCursorVisible;
      const currentText = usernameTexts[usernameIndex];
      if(charIndex>=0 && charIndex<=currentText.length){
        profileUsername.textContent = currentText.substring(0,charIndex) + (usernameCursorVisible?'|':' ');
      }
    }, 500);

    // BIO TYPING
    const bioMessages = ["I created my own.", "DM me.", '<span class="bio-link">guns.lol/javraj</span>'];
    let bioText='', bioIndex=0, bioMessageIndex=0, isBioDeleting=false, bioCursorVisible=true;
    function typeWriterBio(){
      const currentMessage = bioMessages[bioMessageIndex];
      if(!isBioDeleting && bioIndex < currentMessage.length){
        bioText = currentMessage.slice(0, bioIndex+1); bioIndex++;
      } else if(isBioDeleting && bioIndex > 0){
        bioText = currentMessage.slice(0, bioIndex-1); bioIndex--;
      } else if(bioIndex === currentMessage.length){
        isBioDeleting = true; setTimeout(typeWriterBio, 2200); return;
      } else if(bioIndex === 0 && isBioDeleting){
        isBioDeleting = false; bioMessageIndex = (bioMessageIndex+1)%bioMessages.length;
        setTimeout(typeWriterBio, 400); return;
      }
      profileBio.innerHTML = bioText + (bioCursorVisible?'|':' ');
      if(Math.random() < 0.05){
        profileBio.classList.add('glitch');
        setTimeout(()=> profileBio.classList.remove('glitch'), 180);
      }
      setTimeout(typeWriterBio, isBioDeleting?50:100);
    }
    setInterval(()=>{
      bioCursorVisible = !bioCursorVisible;
      const currentMessage = bioMessages[bioMessageIndex];
      if(bioIndex>=0 && bioIndex<=currentMessage.length){
        profileBio.innerHTML = bioText + (bioCursorVisible?'|':' ');
      }
    }, 500);

    // DISCORD STATUS
    async function fetchDiscordStatus(){
      const userId = '1019329014369882123';
      const apiUrl = `https://api.lanyard.rest/v1/users/${userId}`;
      try{
        const response = await fetch(apiUrl);
        const data = await response.json();
        if(data.success){
          const status = data.data.discord_status;
          const lastSeenDate = data.data.last_seen;
          if(statusRing) statusRing.className = 'status-ring ' + status;
          if(lastSeen){
            if(status==='online'||status==='idle'||status==='dnd'){
              lastSeen.textContent = 'Last seen: now';
            } else if(status==='offline' && lastSeenDate){
              const diffMs = Date.now() - new Date(lastSeenDate);
              const diffHours = Math.floor(diffMs/3600000);
              const diffMinutes = Math.floor((diffMs%3600000)/60000);
              let timeAgo = diffHours>0 ? `${diffHours}h ago` : diffMinutes>0 ? `${diffMinutes}m ago` : 'just now';
              lastSeen.textContent = `Last seen: ${timeAgo}`;
            } else {
              lastSeen.textContent = 'Last seen: just now';
            }
          }
        } else { setFallbackStatus(); }
      } catch(err){ setFallbackStatus(); }
    }
    function setFallbackStatus(){
      if(statusRing) statusRing.className = 'status-ring online';
      if(lastSeen) lastSeen.textContent = 'Last seen: now';
    }
    setInterval(fetchDiscordStatus, 30000);

  });
})();
</script>
</body>
</html>
