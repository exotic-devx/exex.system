<style>
  :root{
    --void:#000000;
    --panel:rgba(0,0,0,0.3);
    --paper:#ffffff;
    --mist:rgba(255,255,255,0.62);
    --ash:rgba(255,255,255,0.30);
    --hair:rgba(255,255,255,0.10);
    --font-ui:'JetBrains Mono', 'Courier New', monospace;
    --font-display:'Angel Wish', serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;user-drag:none;}
  *{cursor:none !important;}

  @font-face{
    font-family:'Angel Wish';
    src:url('assets/Angel_wish.ttf') format('truetype');
    font-weight:normal; font-style:normal; font-display:swap;
  }

  html,body{height:100%;}
  body{
    background:var(--void);
    color:var(--paper);
    overflow:hidden;
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }

  #background-wrapper{
    position:fixed; inset:0; z-index:1; overflow:hidden;
    pointer-events:none;
  }
  #background{
    position:absolute; top:50%; left:50%;
    min-width:110%; min-height:110%; width:auto; height:auto;
    object-fit:cover; opacity:0;
    transition:opacity 1.4s ease;
    transform:translate(-50%, -50%) scale(1.05);
    will-change:transform;
  }
  #background.visible{opacity:0.7;}

  .custom-cursor{
    position:fixed; width:40px; height:40px;
    background:url('assets/custom_cursor.png') no-repeat center center; background-size:contain;
    pointer-events:none; z-index:9999; transform:translate(-50%,-50%);
    display:block;
  }

  .hud{
    position:fixed; z-index:15; font-family:var(--font-ui); font-size:10.5px;
    letter-spacing:1.5px; color:var(--ash); pointer-events:none;
    opacity:0; transition:opacity 1s ease;
  }
  .hud.visible{opacity:1;}
  .hud-tl{top:22px; left:26px;}
  .hud-tr{top:22px; right:26px; text-align:right;}
  .hud b{color:var(--mist); font-weight:500;}
  @media (max-width:700px){ .hud{display:none;} }

  #start-screen{
    position:fixed; inset:0; background:#000; display:flex;
    align-items:center; justify-content:center; z-index:50;
    transition:opacity 0.8s ease, backdrop-filter 0.8s ease;
  }
  #start-screen.hidden{
    opacity:0;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    pointer-events:none;
  }
  #start-text{
    font-family:'Angel Wish', serif; font-size:32px; letter-spacing:3px; color:#fff;
    position:relative; z-index:2;
  }

  .stage{
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    perspective:1200px;
    pointer-events:none;
  }
  .stage .card-wrapper{
    pointer-events:auto;
  }
  .card-wrapper{
    position:relative; width:480px; max-width:92vw; min-height:480px;
    transform-style:preserve-3d; transition:transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    opacity:0;
    transform:rotateX(0deg) rotateY(0deg);
    will-change:transform;
  }
  .card-wrapper.flipped{
    transform:rotateY(180deg);
  }
  .card-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:14px;
    min-height:480px;
  }
  .card-front{
    background:var(--panel); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--hair); padding:30px 30px 60px;
    display:flex; flex-direction:column;
    box-shadow:0 0 0 1px rgba(255,255,255,.02), 0 30px 80px rgba(0,0,0,.7);
  }
  .card-back{
    transform:rotateY(180deg);
    background:var(--panel); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--hair); padding:26px 26px 60px;
    display:flex; flex-direction:column; gap:18px;
    box-shadow:0 0 0 1px rgba(255,255,255,.02), 0 30px 80px rgba(0,0,0,.7);
    overflow-y:auto;
  }

  /* ---- flip trigger panel ---- */
  .flip-panel{
    position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.04); border:1px solid var(--hair);
    border-radius:20px; padding:8px 20px; z-index:10;
    pointer-events:auto; cursor:none;
    transition:background .3s ease, border-color .3s ease;
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }
  .flip-panel:hover{
    background:rgba(255,255,255,0.08);
    border-color:rgba(255,255,255,0.2);
  }
  .flip-panel .flip-text{
    font-size:10px; letter-spacing:2px; color:var(--ash);
    text-transform:uppercase; transition:color .3s ease;
  }
  .flip-panel:hover .flip-text{ color:var(--mist); }

  /* ---- FRONT ---- */
  .username-section{ text-align:center; min-height:52px; position:relative; }
  #profile-username{
    font-family:var(--font-display); font-size:38px; font-weight:400; letter-spacing:3px;
    color:#fff; filter:drop-shadow(0 0 18px rgba(255,255,255,.35)); display:inline-block; min-height:48px;
  }
  .rule{
    width:48px; height:1px; margin:22px auto; background:linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
  }
  .badge-section{
    display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom:24px; padding:2px 0;
  }
  .badge-container{ position:relative; width:30px; height:30px; }
  .badge{
    width:30px; height:30px; display:block; border-radius:4px; object-fit:contain;
    filter:grayscale(.55) brightness(1.05); opacity:.85;
    transition:transform .3s cubic-bezier(.25,.1,.25,1), filter .3s ease, opacity .3s ease;
  }
  .badge:hover{ transform:translateY(-3px) scale(1.12); filter:grayscale(0) brightness(1.15) drop-shadow(0 0 10px rgba(255,255,255,.5)); opacity:1; }
  .tooltip{
    visibility:hidden; opacity:0; background:rgba(0,0,0,.6); backdrop-filter:blur(14px);
    color:#fff; text-align:center; border-radius:4px; padding:5px 10px; position:absolute;
    z-index:9999; bottom:calc(100% + 10px); left:50%;
    transform:translateX(-50%) translateY(4px); transition:.22s cubic-bezier(.25,.1,.25,1);
    font-size:10px; letter-spacing:1px; white-space:nowrap; border:1px solid var(--hair);
    pointer-events:none; text-transform:uppercase;
  }
  .badge-container:hover .tooltip{ visibility:visible; opacity:1; transform:translateX(-50%) translateY(0); }

  #profile-bio{
    color:var(--mist); font-size:15px; line-height:1.6; min-height:2em; text-align:center;
    margin:4px 0 22px; padding:0 6px; letter-spacing:.2px;
  }
  #profile-bio .bio-link{
    color:#4fc3f7; text-decoration:none;
    background:linear-gradient(90deg, #4fc3f7, #ffffff, #4fc3f7);
    background-size:200% 100%; -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    animation:shimmer-text 3s ease-in-out infinite; font-weight:bold; cursor:pointer;
    transition:filter .3s ease;
  }
  #profile-bio .bio-link:hover{ filter:drop-shadow(0 0 12px rgba(79,195,247,0.6)); }
  @keyframes shimmer-text{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  .glitch{ animation:glitch .18s ease-in-out; }
  @keyframes glitch{ 0%{transform:translate(0);} 25%{transform:translate(-1px,1px);} 50%{transform:translate(1px,-1px);} 75%{transform:translate(-1px,-1px);} 100%{transform:translate(0);} }

  .profile-main{
    display:flex; align-items:center; gap:14px; background:rgba(255,255,255,.03);
    border:1px solid var(--hair); border-radius:8px; padding:11px 16px; max-width:400px;
    margin:0 auto 20px; width:100%; transition:border-color .4s ease, box-shadow .4s ease;
  }
  .profile-main:hover{
    border-color:rgba(255,255,255,.35);
    box-shadow:0 0 30px rgba(255,255,255,.08);
  }
  .profile-container{ position:relative; width:52px; height:52px; flex-shrink:0; }
  .profile-picture{
    width:52px; height:52px; border-radius:50%; object-fit:cover; display:block;
    border:1px solid rgba(255,255,255,.18); filter:grayscale(.2);
  }
  .status-ring{
    position:absolute; bottom:-1px; right:-1px; width:14px; height:14px; border-radius:50%;
    border:2px solid #000; background:#3a3a3a; transition:all .3s ease;
  }
  .status-ring.online{ background:#fff; box-shadow:0 0 10px rgba(255,255,255,.9); }
  .status-ring.idle{ background:#cfcfcf; box-shadow:0 0 8px rgba(255,255,255,.5); }
  .status-ring.dnd{ background:#8a8a8a; box-shadow:0 0 6px rgba(255,255,255,.3); }
  .status-ring.offline{ background:#3a3a3a; box-shadow:none; }

  .profile-name-section{ flex:1; display:flex; flex-direction:column; min-width:110px; }
  .profile-display-name{
    font-family:var(--font-display); font-size:17px; color:#fff; letter-spacing:.5px; text-align:left;
  }
  .last-seen{ font-size:10px; color:var(--ash); margin-top:3px; text-align:left; letter-spacing:.5px; }

  .social-links{
    display:flex; justify-content:center; gap:24px; align-items:center; padding:4px 0 0;
    margin-top:4px;
  }
  .social-link-tooltip{ position:relative; display:inline-block; }
  .social-icon{
    width:30px; height:30px; opacity:.7; filter:grayscale(1) brightness(2) drop-shadow(0 0 0 rgba(255,255,255,0));
    transition:transform .3s ease, filter .3s ease, opacity .3s ease;
  }
  .social-link-tooltip:hover .social-icon{
    opacity:1; transform:translateY(-3px); filter:grayscale(1) brightness(2) drop-shadow(0 0 14px rgba(255,255,255,.7));
  }
  .social-link-tooltip .tooltip-text{
    visibility:hidden; opacity:0; background:rgba(0,0,0,.6); backdrop-filter:blur(14px);
    color:#fff; text-align:center; border-radius:4px; padding:5px 10px; position:absolute;
    z-index:9999; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%) translateY(4px);
    transition:.22s cubic-bezier(.25,.1,.25,1); font-size:10px; letter-spacing:1px; white-space:nowrap;
    border:1px solid var(--hair); pointer-events:none; text-transform:uppercase;
  }
  .social-link-tooltip:hover .tooltip-text{ visibility:visible; opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- BACK ---- */
  .back-title{
    font-size:11px; letter-spacing:3px; color:var(--ash); text-transform:uppercase;
    text-align:center; margin-bottom:2px;
  }
  .back-divider{
    width:36px; height:1px; margin:4px auto; background:linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
  }

  .clock-panel, .spotify-panel, .game-panel{
    background:rgba(255,255,255,.03); border:1px solid var(--hair); border-radius:10px;
    display:flex; align-items:center; gap:14px;
    transition:border-color .3s ease, box-shadow .3s ease, background .3s ease;
  }
  .clock-panel:hover, .spotify-panel:hover, .game-panel:hover{
    border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.045);
    box-shadow:0 0 24px rgba(255,255,255,.06);
  }

  .clock-panel{ padding:14px 18px; }
  .clock-panel .clock-svg{ width:54px; height:54px; flex-shrink:0; }
  .clock-panel .clock-info{ flex:1; }
  .clock-panel .clock-time{ font-size:25px; font-weight:300; letter-spacing:2px; font-family:var(--font-display); color:#fff; }
  .clock-panel .clock-date{ font-size:10.5px; color:var(--ash); letter-spacing:1px; margin-top:3px; }
  .clock-panel .clock-location{ font-size:9.5px; color:var(--ash); letter-spacing:1px; margin-top:5px; display:flex; align-items:center; gap:5px; }
  .clock-panel .clock-location svg{ width:11px; height:11px; stroke:var(--ash); fill:none; }

  .spotify-panel, .game-panel{ padding:12px 16px; }
  .spotify-panel .cover, .game-panel .cover{
    width:52px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0;
    background:rgba(255,255,255,.05); border:1px solid var(--hair);
  }
  .spotify-panel .info, .game-panel .info{ flex:1; overflow:hidden; }
  .spotify-panel .track-name, .game-panel .game-name{
    font-size:13px; font-weight:500; color:#fff; letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .spotify-panel .artist-name, .game-panel .game-detail{
    font-size:10px; color:var(--ash); letter-spacing:.3px; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .spotify-panel .progress-wrapper{
    display:flex; align-items:center; gap:6px; margin-top:6px;
  }
  .spotify-panel .progress-bar{
    flex:1; height:3px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden;
  }
  .spotify-panel .progress-bar .progress-fill{
    height:100%; width:0%; background:linear-gradient(90deg, #4fc3f7, #fff);
    border-radius:2px; transition:width .3s ease;
    box-shadow:0 0 12px rgba(79,195,247,0.3);
  }
  .spotify-panel .progress-time{
    font-size:8.5px; color:var(--ash); font-family:var(--font-ui); min-width:32px; text-align:center;
  }

  .hidden{ display:none !important; }

  @media (max-width:580px){
    .card-wrapper{ min-height:auto; width:440px; }
    .card-front{ padding:20px 16px 54px; min-height:auto; }
    .card-back{ padding:18px 14px 54px; min-height:auto; gap:12px; }
    #profile-username{ font-size:30px; min-height:40px; }
    .rule{ margin:16px auto; }
    .badge-section{ margin-bottom:16px; }
    #profile-bio{ margin:4px 0 16px; }
    .profile-main{ max-width:320px; padding:8px 12px; gap:10px; border-radius:6px; margin:0 auto 14px; }
    .profile-container,.profile-picture{ width:44px; height:44px; }
    .profile-display-name{ font-size:14px; }
    .badge,.badge-container{ width:25px; height:25px; }
    .social-icon{ width:26px; height:26px; }
    .clock-panel{ padding:10px 12px; gap:10px; }
    .clock-panel .clock-time{ font-size:20px; }
    .clock-panel .clock-svg{ width:40px; height:40px; }
    .spotify-panel .cover, .game-panel .cover{ width:38px; height:38px; }
    .spotify-panel, .game-panel{ padding:8px 10px; gap:10px; }
    .spotify-panel .track-name, .game-panel .game-name{ font-size:11.5px; }
    .flip-panel{ padding:6px 14px; bottom:10px; }
    .flip-panel .flip-text{ font-size:9px; }
  }

  @media (max-width:400px){
    .card-wrapper{ width:380px; }
    #profile-username{ font-size:26px; min-height:36px; }
    .profile-main{ max-width:280px; padding:6px 10px; gap:8px; }
    .profile-container,.profile-picture{ width:38px; height:38px; }
    .badge,.badge-container{ width:22px; height:22px; }
    .social-icon{ width:22px; height:22px; }
  }
</style>
</head>

</div>

<audio id="background-music" loop>
  <source src="https://r2.guns.lol/6556d09a-6fa7-420b-93c5-8ecd37424977.mp3" type="audio/mp3">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function(){
  "use strict";

  document.addEventListener('DOMContentLoaded', function(){

    const startScreen   = document.getElementById('start-screen');
    const startText     = document.getElementById('start-text');
    const cardWrapper   = document.getElementById('cardWrapper');
    const cardFront     = document.getElementById('cardFront');
    const cardBack       = document.getElementById('cardBack');
    const profileUsername = document.getElementById('profile-username');
    const profileBio    = document.getElementById('profile-bio');
    const backgroundVideo = document.getElementById('background');
    const backgroundMusic = document.getElementById('background-music');
    const customCursor  = document.getElementById('customCursor');
    const statusRing    = document.getElementById('status-ring');
    const lastSeen      = document.getElementById('last-seen');
    const clockEl       = document.getElementById('clock');
    const uptimeEl      = document.getElementById('uptime');
    const backClockEl   = document.getElementById('backClock');
    const backDateEl    = document.getElementById('backDate');
    const huds          = [document.getElementById('hudTl'), document.getElementById('hudTr')];

    let isFlipped = false;
    const bootTime = Date.now();

    // ----- CURSOR -----
    document.addEventListener('mousemove', (e) => {
      customCursor.style.left = e.clientX + 'px';
      customCursor.style.top = e.clientY + 'px';
    });

    // ----- CLOCK / UPTIME -----
    function pad(n){ return n.toString().padStart(2,'0'); }
    function tickClock(){
      const d = new Date();
      const h = pad(d.getHours()), m = pad(d.getMinutes()), s = pad(d.getSeconds());
      clockEl.textContent = h+':'+m+':'+s;
      backClockEl.textContent = h+':'+m+':'+s;
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      backDateEl.textContent = d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
      const diff = Math.floor((Date.now()-bootTime)/1000);
      const mm = Math.floor(diff/60), ss = diff%60;
      uptimeEl.textContent = pad(mm)+':'+pad(ss);
      const hourDeg = (d.getHours()%12)*30 + d.getMinutes()*0.5;
      const minDeg = d.getMinutes()*6 + d.getSeconds()*0.1;
      const secDeg = d.getSeconds()*6;
      const hourHand = document.getElementById('hourHand');
      const minHand = document.getElementById('minHand');
      const secHand = document.getElementById('secHand');
      if(hourHand) hourHand.setAttribute('transform', `rotate(${hourDeg},50,50)`);
      if(minHand) minHand.setAttribute('transform', `rotate(${minDeg},50,50)`);
      if(secHand) secHand.setAttribute('transform', `rotate(${secDeg},50,50)`);
    }
    setInterval(tickClock, 1000);
    tickClock();

    // ----- START SCREEN -----
    const startMessage = "click here...";
    let startTextContent = '';
    let startIndex = 0;
    let isDeletingStart = false;
    let startCursorVisible = true;

    function typeWriterStart() {
      if (!isDeletingStart && startIndex < startMessage.length) {
        startTextContent = startMessage.slice(0, startIndex + 1);
        startIndex++;
        setTimeout(typeWriterStart, 100);
      } else if (isDeletingStart && startIndex > 0) {
        startTextContent = startMessage.slice(0, startIndex - 1);
        startIndex--;
        setTimeout(typeWriterStart, 60);
      } else if (startIndex === startMessage.length) {
        isDeletingStart = true;
        setTimeout(typeWriterStart, 1500);
      } else if (startIndex === 0 && isDeletingStart) {
        isDeletingStart = false;
        setTimeout(typeWriterStart, 500);
      }
      startText.textContent = startTextContent + (startCursorVisible ? '|' : ' ');
    }
    setInterval(() => {
      startCursorVisible = !startCursorVisible;
      startText.textContent = startTextContent + (startCursorVisible ? '|' : ' ');
    }, 500);
    typeWriterStart();

    // ----- START APP -----
    function startApp() {
      startScreen.classList.add('hidden');
      if (backgroundVideo) {
        backgroundVideo.muted = true;
        backgroundVideo.play().catch(()=>{});
        setTimeout(()=> backgroundVideo.classList.add('visible'), 100);
      }
      if (backgroundMusic) {
        backgroundMusic.volume = 0.28;
        backgroundMusic.muted = false;
        backgroundMusic.play().catch(()=>{});
      }
      cardWrapper.style.opacity = '1';
      gsap.fromTo(cardWrapper, {opacity:0, y:-20, scale:0.96}, {opacity:1, y:0, scale:1, duration:0.9, ease:'power2.out'});
      huds.forEach((h,i)=> setTimeout(()=> h.classList.add('visible'), 300 + i*120));
      typeWriterUsername();
      typeWriterBio();
      fetchDiscordStatus();
    }
    startScreen.addEventListener('click', startApp);
    startScreen.addEventListener('touchstart', (e)=>{ e.preventDefault(); startApp(); });

    // ----- FLIP CARD (click su pannello, click sulla card, o tasto SPACE) -----
    let flipAnimating = false;
    function toggleFlip(e) {
      if(e) e.stopPropagation();
      isFlipped = !isFlipped;
      cardWrapper.classList.toggle('flipped');
      flipAnimating = true;
      cardWrapper.style.transition = 'transform 0.8s cubic-bezier(0.23, 1, 0.32, 1)';
      let transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
      if (isFlipped) {
        transform += ` rotateY(180deg)`;
      }
      cardWrapper.style.transform = transform;
      setTimeout(() => { flipAnimating = false; }, 820);
    }

    document.getElementById('flipFrontPanel').addEventListener('click', toggleFlip);
    document.getElementById('flipBackPanel').addEventListener('click', toggleFlip);

    cardFront.addEventListener('click', (e) => {
      if(e.target.closest('a, .badge-container, .flip-panel')) return;
      toggleFlip(e);
    });
    cardBack.addEventListener('click', (e) => {
      if(e.target.closest('a, .flip-panel')) return;
      toggleFlip(e);
    });

    document.addEventListener('keydown', (e) => {
      if(e.code === 'Space') {
        e.preventDefault();
        toggleFlip(e);
      }
    });

    // ----- EFFETTO 3D SULLO SFONDO -----
    let tiltX = 0, tiltY = 0;
    let targetTiltX = 0, targetTiltY = 0;
    let isMouseOnCard = false;

    document.addEventListener('mousemove', (e) => {
      const rect = document.body.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const relX = Math.max(-1, Math.min(1, (e.clientX - centerX) / centerX));
      const relY = Math.max(-1, Math.min(1, (e.clientY - centerY) / centerY));
      const maxTilt = 8;
      targetTiltX = relY * maxTilt;
      targetTiltY = -relX * maxTilt;
      const px = (e.clientX / window.innerWidth - 0.5) * 8;
      const py = (e.clientY / window.innerHeight - 0.5) * 4;
      backgroundVideo.style.transform = `translate(-50%, -50%) scale(1.05) translate(${px}px, ${py}px)`;
    });

    function animateTilt() {
      tiltX += (targetTiltX - tiltX) * 0.08;
      tiltY += (targetTiltY - tiltY) * 0.08;
      if (!isMouseOnCard && !flipAnimating) {
        cardWrapper.style.transition = 'none';
        let transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
        if (isFlipped) {
          transform += ` rotateY(180deg)`;
        }
        cardWrapper.style.transform = transform;
      }
      requestAnimationFrame(animateTilt);
    }

    cardWrapper.addEventListener('mouseenter', () => {
      isMouseOnCard = true;
    });
    cardWrapper.addEventListener('mouseleave', () => {
      isMouseOnCard = false;
      cardWrapper.style.transition = 'transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1)';
      if (!isFlipped) {
        cardWrapper.style.transform = 'rotateX(0deg) rotateY(0deg)';
      } else {
        cardWrapper.style.transform = 'rotateY(180deg)';
      }
      tiltX = 0; tiltY = 0;
      targetTiltX = 0; targetTiltY = 0;
    });

    animateTilt();

    // ----- USERNAME TYPING -----
    const usernameTexts = ["𝔢𝔵𝔬𝔱𝔦𝔠"];
    let usernameIndex = 0, charIndex = 0, isDeleting = false, usernameCursorVisible = true;
    function typeWriterUsername(){
      const currentText = usernameTexts[usernameIndex];
      if(!isDeleting && charIndex <= currentText.length){
        profileUsername.textContent = currentText.substring(0,charIndex) + (usernameCursorVisible?'|':' ');
        charIndex++;
        setTimeout(typeWriterUsername, isDeleting?80:150);
      } else if(isDeleting && charIndex >= 0){
        profileUsername.textContent = currentText.substring(0,charIndex) + (usernameCursorVisible?'|':' ');
        charIndex--;
        setTimeout(typeWriterUsername, 60);
      } else if(!isDeleting && charIndex > currentText.length){
        isDeleting = true; setTimeout(typeWriterUsername, 2200);
      } else if(isDeleting && charIndex < 0){
        isDeleting = false; usernameIndex = (usernameIndex+1)%usernameTexts.length;
        setTimeout(typeWriterUsername, 500);
      }
    }
    setInterval(()=>{
      usernameCursorVisible = !usernameCursorVisible;
      const currentText = usernameTexts[usernameIndex];
      if(charIndex>=0 && charIndex<=currentText.length){
        profileUsername.textContent = currentText.substring(0,charIndex) + (usernameCursorVisible?'|':' ');
      }
    }, 500);

    // ----- BIO TYPING -----
    const bioMessages = ["I created my own.", "DM me.", '<span class="bio-link">guns.lol/javraj</span>'];
    let bioText='', bioIndex=0, bioMessageIndex=0, isBioDeleting=false, bioCursorVisible=true;
    function typeWriterBio(){
      const currentMessage = bioMessages[bioMessageIndex];
      if(!isBioDeleting && bioIndex < currentMessage.length){
        bioText = currentMessage.slice(0, bioIndex+1); bioIndex++;
      } else if(isBioDeleting && bioIndex > 0){
        bioText = currentMessage.slice(0, bioIndex-1); bioIndex--;
      } else if(bioIndex === currentMessage.length){
        isBioDeleting = true; setTimeout(typeWriterBio, 2200); return;
      } else if(bioIndex === 0 && isBioDeleting){
        isBioDeleting = false; bioMessageIndex = (bioMessageIndex+1)%bioMessages.length;
        setTimeout(typeWriterBio, 400); return;
      }
      profileBio.innerHTML = bioText + (bioCursorVisible?'|':' ');
      if(Math.random() < 0.05){
        profileBio.classList.add('glitch');
        setTimeout(()=> profileBio.classList.remove('glitch'), 180);
      }
      setTimeout(typeWriterBio, isBioDeleting?50:100);
    }
    setInterval(()=>{
      bioCursorVisible = !bioCursorVisible;
      const currentMessage = bioMessages[bioMessageIndex];
      if(bioIndex>=0 && bioIndex<=currentMessage.length){
        profileBio.innerHTML = bioText + (bioCursorVisible?'|':' ');
      }
    }, 500);

    // ----- DISCORD STATUS + SPOTIFY + GAME -----
    async function fetchDiscordStatus(){
      const userId = '1019329014369882123';
      const apiUrl = `https://api.lanyard.rest/v1/users/${userId}`;
      try{
        const response = await fetch(apiUrl);
        const data = await response.json();
        if(data.success){
          const status = data.data.discord_status;
          const lastSeenDate = data.data.last_seen;
          if(statusRing) statusRing.className = 'status-ring ' + status;
          if(lastSeen){
            if(status==='online'||status==='idle'||status==='dnd'){
              lastSeen.textContent = 'Last seen: now';
            } else if(status==='offline' && lastSeenDate){
              const diffMs = Date.now() - new Date(lastSeenDate);
              const diffHours = Math.floor(diffMs/3600000);
              const diffMinutes = Math.floor((diffMs%3600000)/60000);
              let timeAgo = diffHours>0 ? `${diffHours}h ago` : diffMinutes>0 ? `${diffMinutes}m ago` : 'just now';
              lastSeen.textContent = `Last seen: ${timeAgo}`;
            } else {
              lastSeen.textContent = 'Last seen: just now';
            }
          }
          updateSpotifyGame(data.data);
        } else { setFallbackStatus(); }
      } catch(err){ setFallbackStatus(); }
    }

    function setFallbackStatus(){
      if(statusRing) statusRing.className = 'status-ring online';
      if(lastSeen) lastSeen.textContent = 'Last seen: now';
    }

    function updateSpotifyGame(data){
      const spotify = data.spotify;
      const activities = data.activities || [];

      // Spotify
      const spotifyCover = document.getElementById('spotifyCover');
      const spotifyTrack = document.getElementById('spotifyTrack');
      const spotifyArtist = document.getElementById('spotifyArtist');
      const spotifyProgress = document.getElementById('spotifyProgress');
      const progressCurrent = document.getElementById('progressCurrent');
      const progressTotal = document.getElementById('progressTotal');

      if(spotify && spotify.song){
        spotifyCover.src = spotify.album_art_url || 'assets/gift.png';
        spotifyTrack.textContent = spotify.song;
        spotifyArtist.textContent = spotify.artist;
        if(spotify.timestamps){
          const start = spotify.timestamps.start;
          const end = spotify.timestamps.end;
          const now = Date.now();
          const elapsed = Math.floor((now - start) / 1000);
          const total = Math.floor((end - start) / 1000);
          const progress = Math.min(100, Math.max(0, ((now - start) / (end - start)) * 100));
          spotifyProgress.style.width = progress + '%';
          progressCurrent.textContent = formatTime(elapsed);
          progressTotal.textContent = formatTime(total);
        }
      } else {
        spotifyCover.src = 'assets/gift.png';
        spotifyTrack.textContent = 'No song playing';
        spotifyArtist.textContent = '—';
        spotifyProgress.style.width = '0%';
        progressCurrent.textContent = '0:00';
        progressTotal.textContent = '0:00';
      }

      // Game
      const gameActivity = activities.find(a => a.type === 0);
      const gameCover = document.getElementById('gameCover');
      const gameName = document.getElementById('gameName');
      const gameDetail = document.getElementById('gameDetail');

      if(gameActivity && gameActivity.name){
        if(gameActivity.assets && gameActivity.assets.large_image) {
          gameCover.src = `https://cdn.discordapp.com/app-assets/${gameActivity.application_id}/${gameActivity.assets.large_image}.png`;
        } else {
          gameCover.src = 'assets/gift.png';
        }
        gameName.textContent = gameActivity.name;
        let details = '';
        if(gameActivity.details) details += gameActivity.details + ' ';
        if(gameActivity.state) details += gameActivity.state;
        gameDetail.textContent = details || 'Playing now';
        if(gameActivity.timestamps && gameActivity.timestamps.start){
          const elapsed = Math.floor((Date.now() - gameActivity.timestamps.start) / 60000);
          const hours = Math.floor(elapsed / 60);
          const minutes = Math.floor(elapsed % 60);
          if(hours > 0) {
            gameDetail.textContent += ` (${hours}:${minutes.toString().padStart(2, '0')}h)`;
          } else {
            gameDetail.textContent += ` (${minutes}m)`;
          }
        }
      } else {
        gameCover.src = 'assets/gift.png';
        gameName.textContent = 'No game running';
        gameDetail.textContent = '—';
      }
    }

    function formatTime(seconds){
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    setInterval(fetchDiscordStatus, 30000);

  });
})();
</script>
</body>
</html>
